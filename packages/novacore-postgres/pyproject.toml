[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novacore-postgres"
version = "0.1.0"
description = "PostgreSQL persistence adapter for Novacore Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
asyncpg = ["asyncpg>=0.31.0"]
psycopg = ["psycopg[binary]>=3.2"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["novacore.postgres*"]

