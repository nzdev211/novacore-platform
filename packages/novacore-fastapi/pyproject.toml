[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novacore-fastapi"
version = "0.1.0"
description = "FastAPI inbound adapter for Novacore Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
fastapi = ["fastapi>=0.110", "uvicorn[standard]>=0.25", "pydantic>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["novacore.fastapi*"]

