[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novacore-runtime"
version = "0.1.0"
description = "Novacore execution orchestration and application ports"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["novacore.runtime*"]

