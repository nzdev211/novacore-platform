[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novacore-openai"
version = "0.1.0"
description = "OpenAI API adapter for Novacore Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
openai = ["openai"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["novacore.openai*"]

