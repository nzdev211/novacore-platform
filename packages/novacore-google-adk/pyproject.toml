[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novacore-google-adk"
version = "0.1.0"
description = "Google ADK integration adapter for Novacore Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
google-adk = ["google-adk[a2a]>=1.31.1"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["novacore.google_adk*"]

