[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novacore-firestore"
version = "0.1.0"
description = "Firestore persistence adapter for Novacore Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
firestore = ["google-cloud-firestore>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
include = ["novacore.firestore*"]

